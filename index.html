<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTrack | Job Application Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER-->
    <header class="app-header">
      <h1 class="app-title">JobTrack</h1>

      <button
        class="add-application-btn"
        id="add-application-btn"
        type="button"
      >
        + Add Application
      </button>
    </header>

    <!-- MAIN APP -->
    <main class="dashboard">
      <section class="stats-grid">
        <div class="stat-card">
          <h2>Total</h2>
          <p id="total-applications-count">0</p>
        </div>

        <div class="stat-card">
          <h2>Interviews</h2>
          <p id="interview-count">0</p>
        </div>

        <div class="stat-card">
          <h2>Offers</h2>
          <p id="offer-count">0</p>
        </div>

        <div class="stat-card">
          <h2>Rejected</h2>
          <p id="rejected-count">0</p>
        </div>
      </section>

      <section class="application-controls">
        <input
          type="search"
          id="application-search"
          placeholder="Search applications..."
        />

        <select id="status-filter">
          <option value="all">Show All</option>
          <option value="applied">Applied</option>
          <option value="interview">Interview</option>
          <option value="technical-interview">Technical Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>

        <select id="sort-applications">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="company-asc">Company A-Z</option>
          <option value="company-desc">Company Z-A</option>
        </select>
      </section>

      <section class="applications-section">
        <h2>Applications</h2>

        <div class="applications-list" id="applications-list">
          <p class="empty-state" id="empty-state">No applications yet.</p>
        </div>
      </section>
    </main>

    <!-- APPLICATION FORM -->
    <div class="modal-overlay" id="application-modal">
      <div class="application-modal">
        <form class="application-form" id="application-form">
          <h2 id="application-modal-title">Add Application</h2>

          <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" required />
          </div>

          <div class="form-group">
            <label for="position">Position</label>
            <input type="text" id="position" name="position" required />
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" />
          </div>

          <div class="form-group">
            <label for="salary">Salary</label>
            <input
              type="number"
              id="salary"
              name="salary"
              min="0"
              placeholder="e.g. 25000"
            />
          </div>

          <div class="form-group">
            <label for="application-date">Application Date</label>
            <input
              type="date"
              id="application-date"
              name="application-date"
              required
            />
          </div>

          <div class="form-group">
            <select id="application-status" name="status" required>
              <option value="applied">Applied</option>
              <option value="interview">Interview</option>
              <option value="technical-interview">Technical Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>

          <div class="form-group">
            <label for="notes">Notes</label>
            <textarea
              id="notes"
              name="notes"
              placeholder="Add notes about this application..."
            ></textarea>
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="cancel-btn"
              id="cancel-application-btn"
            >
              Cancel
            </button>

            <button type="submit" class="save-application-btn">
              Save Application
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
